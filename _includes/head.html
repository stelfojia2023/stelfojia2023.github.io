<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f0e8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161412">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% if page.extra_css %}
  {% for sheet in page.extra_css %}
    <link rel="stylesheet" href="{{ sheet | relative_url }}">
  {% endfor %}
{% endif %}
{% if page.layout == "post" %}
  <link rel="stylesheet" href="{{ '/assets/article-theme.css' | relative_url }}">
{% endif %}
{% feed_meta %}
{% seo %}
<script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      if (stored === "light" || stored === "dark") {
        document.documentElement.setAttribute("data-theme", stored);
      }
    } catch (e) {}
  })();
</script>
