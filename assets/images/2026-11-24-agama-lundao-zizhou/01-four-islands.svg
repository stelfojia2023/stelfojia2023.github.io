4,334.78125" id="my-svg-L_F_J_0" class="edge-thickness-invisible edge-pattern-solid" style="stroke-dasharray: 0 0 52.3984375 0; stroke-dashoffset: 0;;" data-edge="true" data-et="edge" data-id="L_F_J_0" data-points="W3sieCI6MjA0LCJ5IjoyODIuMzgyODEyNX0seyJ4IjoyMDQsInkiOjMzNC43ODEyNX1d" data-look="neo"/><path d="M628,294.78125L628,334.78125" id="my-svg-L_D_L_0" class="edge-thickness-invisible edge-pattern-solid" style="stroke-dasharray: 0 0 40 0; stroke-dashoffset: 0;;" data-edge="true" data-et="edge" data-id="L_D_L_0" data-points="W3sieCI6NjI4LCJ5IjoyOTQuNzgxMjV9LHsieCI6NjI4LCJ5IjozMzQuNzgxMjV9XQ==" data-look="neo"/></g><g class="edgeLabels"/><g class="nodes"><g class="node default q" id="my-svg-flowchart-Q-0" data-look="neo" transform="translate(416, 59.796875)"><rect class="basic label-container" style="fill:#EFE6D6 !important;stroke:#8C6A3F !important;stroke-width:1.8px !important" x="-282" y="-47.796875" width="564" height="95.59375"/><g class="label" style="color:#1A1714 !important" transform="translate(-266, -35.796875)"><rect/><foreignObject width="532" height="71.59375"><div style="color: rgb(26, 23, 20) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 380px; text-align: center; width: 380px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1A1714 !important" class="nodeLabel"><p></p><div style="width:520px;text-align:center;padding:8px 6px 14px;line-height:1.55">佛陀问：洪水来时站得住的洲，是什么？<br />它是真的不会变，还是只是暂时没变？</div><p></p></span></div></foreignObject></g></g><g class="node default fotuo" id="my-svg-flowchart-F-1" data-look="neo" transform="translate(204, 221.1875)"><rect class="basic label-container" style="fill:#E8F0EC !important;stroke:#4E7A62 !important;stroke-width:1.8px !important" x="-192" y="-61.1953125" width="384" height="122.390625"/><g class="label" style="color:#1A1714 !important" transform="translate(-176, -49.1953125)"><rect/><foreignObject width="352" height="98.390625"><div style="color: rgb(26, 23, 20) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 380px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1A1714 !important" class="nodeLabel"><p></p><div style="width:340px;text-align:center;padding:8px 6px 16px;line-height:1.55">佛陀：自洲 + 法洲<br />努力照常，心站在自己能看清的地方<br />结论会变；回去再看一遍的动作用得上</div><p></p></span></div></foreignObject></g></g><g class="node default dabot" id="my-svg-flowchart-D-2" data-look="neo" transform="translate(628, 221.1875)"><rect class="basic label-container" style="fill:#E8EEF4 !important;stroke:#4A6A8A !important;stroke-width:1.8px !important" x="-192" y="-73.59375" width="384" height="147.1875"/><g class="label" style="color:#1A1714 !important" transform="translate(-176, -61.59375)"><rect/><foreignObject width="352" height="123.1875"><div style="color: rgb(26, 23, 20) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 380px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1A1714 !important" class="nodeLabel"><p></p><div style="width:340px;text-align:center;padding:8px 6px 16px;line-height:1.55">大Bot：原文和核对<br />靠的不是「我一定对」<br />而是每次回到原文再看一遍<br />佛陀：这正是法洲</div><p></p></span></div></foreignObject></g></g><g class="node default jiaoyuan" id="my-svg-flowchart-J-3" data-look="neo" transform="translate(204, 408.375)"><rect class="basic label-container" style="fill:#F8E8DC !important;stroke:#A05A3A !important;stroke-width:1.8px !important" x="-192" y="-73.59375" width="384" height="147.1875"/><g class="label" style="color:#1A1714 !important" transform="translate(-176, -61.59375)"><rect/><foreignObject width="352" height="123.1875"><div style="color: rgb(26, 23, 20) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 380px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1A1714 !important" class="nodeLabel"><p></p><div style="width:340px;text-align:center;padding:8px 6px 16px;line-height:1.55">教员：洲不在「自」，在实践和群众<br />不同意「不异洲」，一个人站不住<br />世上没有不变的地<br />能站住的只有不停地实践</div><p></p></span></div></foreignObject></g></g><g class="node default laozi" id="my-svg-flowchart-L-4" data-look="neo" transform="translate(628, 408.375)"><rect class="basic label-container" style="fill:#F3EDE4 !important;stroke:#8C6A3F !important;stroke-width:1.8px !important" x="-192" y="-73.59375" width="384" height="147.1875"/><g class="label" style="color:#1A1714 !important" transform="translate(-176, -61.59375)"><rect/><foreignObject width="352" height="123.1875"><div style="color: rgb(26, 23, 20) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 380px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1A1714 !important" class="nodeLabel"><p></p><div style="width:340px;text-align:center;padding:8px 6px 16px;line-height:1.55">老子：我没有洲，我学的是水<br />道本来就在变，但变得有常<br />内卷是「为学日益」，破法是减<br />问今天哪一件可以不做</div><p></p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>