important;stroke-width:1.8px !important" x="-128.0078125" y="-24" width="256.015625" height="48"/><g class="label" style="color:#2A1508 !important" transform="translate(-112.0078125, -12)"><rect/><foreignObject width="224.015625" height="24"><div style="color: rgb(42, 21, 8) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#2A1508 !important" class="nodeLabel"><p>撤回这个改动（不留错误修复）</p></span></div></foreignObject></g></g><g class="node default claude" id="my-svg-flowchart-P-7" data-look="neo" transform="translate(196.0078125, 388)"><rect class="basic label-container" style="fill:#CFE0EE !important;stroke:#4A6F8F !important;stroke-width:1.8px !important" x="-112.0078125" y="-24" width="224.015625" height="48"/><g class="label" style="color:#10202E !important" transform="translate(-96.0078125, -12)"><rect/><foreignObject width="192.015625" height="24"><div style="color: rgb(16, 32, 46) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#10202E !important" class="nodeLabel"><p>补更细粒度的内存剖析遥测</p></span></div></foreignObject></g></g><g class="node default claude" id="my-svg-flowchart-F-9" data-look="neo" transform="translate(196.0078125, 476)"><rect class="basic label-container" style="fill:#CFE0EE !important;stroke:#4A6F8F !important;stroke-width:1.8px !important" x="-184.0078125" y="-24" width="368.015625" height="48"/><g class="label" style="color:#10202E !important" transform="translate(-168.0078125, -12)"><rect/><foreignObject width="336.015625" height="24"><div style="color: rgb(16, 32, 46) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#10202E !important" class="nodeLabel"><p>定位：每次按键都把文档复制进好几种数据结构</p></span></div></foreignObject></g></g><g class="node default claude" id="my-svg-flowchart-FIX-11" data-look="neo" transform="translate(196.0078125, 564)"><rect class="basic label-container" style="fill:#CFE0EE !important;stroke:#4A6F8F !important;stroke-width:1.8px !important" x="-152.0078125" y="-24" width="304.015625" height="48"/><g class="label" style="color:#10202E !important" transform="translate(-136.0078125, -12)"><rect/><foreignObject width="272.015625" height="24"><div style="color: rgb(16, 32, 46) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#10202E !important" class="nodeLabel"><p>改成写时复制：多个结构共享一份引用</p></span></div></foreignObject></g></g><g class="node default sys" id="my-svg-flowchart-R-13" data-look="neo" transform="translate(196.0078125, 664)"><rect class="basic label-container" style="fill:#DCE8D0 !important;stroke:#5E7F45 !important;stroke-width:1.8px !important" x="-148.6640625" y="-36" width="297.328125" height="72"/><g class="label" style="color:#15220C !important" transform="translate(-132.6640625, -24)"><rect/><foreignObject width="265.328125" height="48"><div style="color: rgb(21, 34, 12) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#15220C !important" class="nodeLabel"><p>约三天迭代后：该文档峰值约 180 MB<br />上线所需 pod 估算：500+ → 约 50</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>